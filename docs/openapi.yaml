# Contrato del Gremio De Aventureros API, en formato OpenAPI 3.0.
# Se sirve en http://localhost:3000/docs con Swagger UI. Guardá el archivo y recargá la página.
#
# Este contrato describe SOLO los endpoints que están montados en src/server.ts.

openapi: 3.0.3

info:
  title: Gremio De Aventureros API
  version: 1.0.0
  description: |
    Missions, users and asignments of adventurers to missions.

    **Conventions**
    - All requests and responses are JSON.
    - Successful responses with a body have the shape `{ "data": ... }`: an object for one item, an array for a list.
    - `204` responses have no body.
    - Errors from the services have the shape `{ "error": "..." }` (see the `Error` schema).
    - Protected endpoints need the header `Authorization: Bearer <token>` (get the token from `POST /auth/login`).
    - The authentication middleware answers `401` and `403` with a plain text body (`Unauthorized` / `Forbidden`), not JSON.

servers:
  - url: http://localhost:3000

tags:
  - name: Auth
  - name: Missions
  - name: Asigned

paths:
  /auth/register:
    post:
      summary: Register a new user (role `user`)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Log in and get a token (valid for 1 hour)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid credentials (this response uses `message`, not `error`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /missions:
    get:
      summary: List all missions
      tags: [Missions]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of missions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Create a mission (admin only)
      tags: [Missions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMission"
      responses:
        "201":
          description: Mission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /missions/{id}:
    get:
      summary: Get a mission by id
      tags: [Missions]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Mission found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Replace the fields of a mission (needs all the fields of a new mission)
      tags: [Missions]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMission"
      responses:
        "200":
          description: Mission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mission or gremio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a mission (admin only, only if it has no adventurers assigned)
      tags: [Missions]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Mission deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Mission has adventurers assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /asigned:
    post:
      summary: Assign one or more adventurers to a mission (the mission becomes unavailable)
      tags: [Asigned]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAsigned"
      responses:
        "201":
          description: Adventurers assigned. Returns every asignment of the mission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsignedListResponse"
        "404":
          description: Mission or adventurer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Mission is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: Missing token (plain text body `Unauthorized`)
      content:
        text/plain:
          schema: { type: string, example: Unauthorized }
    Forbidden:
      description: Invalid token, or the user does not have the required role (plain text body `Forbidden`)
      content:
        text/plain:
          schema: { type: string, example: Forbidden }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Mission not found

    Message:
      type: object
      required: [message]
      properties:
        message: { type: string, example: Usuario creado }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "aria@gremio.com" }
        password: { type: string, example: "password123" }

    TokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string, example: "eyJhbGciOiJIUzI1NiIs..." }

    Mission:
      type: object
      required: [id, title, objetive, level, gremio_id, status]
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: "Cazar al dragón" }
        objetive: { type: string, example: "Derrotar al dragón de la montaña" }
        level: { type: integer, example: 5 }
        gremio_id: { type: integer, example: 1 }
        status:
          type: boolean
          description: true = available, false = already assigned
          example: true

    NewMission:
      type: object
      required: [title, objetive, level, gremio_id]
      properties:
        title: { type: string, maxLength: 200, example: "Cazar al dragón" }
        objetive: { type: string, maxLength: 200, example: "Derrotar al dragón de la montaña" }
        level: { type: integer, example: 5 }
        gremio_id: { type: integer, example: 1 }

    MissionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Mission"

    MissionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Mission"

    Asigned:
      type: object
      required: [id, missions_id, adventurer_id]
      properties:
        id: { type: integer, example: 1 }
        missions_id: { type: integer, example: 4 }
        adventurer_id: { type: integer, example: 1 }

    NewAsigned:
      type: object
      required: [missionId, adventurerIds]
      properties:
        missionId: { type: integer, example: 4 }
        adventurerIds:
          type: array
          minItems: 1
          items: { type: integer }
          example: [1, 3]

    AsignedListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Asigned"